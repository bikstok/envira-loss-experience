name: Test Suite & Pull Request Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-suite:
    name: Run Test Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Unpack Test Data (if secret configured)
        env:
          DATA_ARCHIVE: ${{ secrets.DATA_ZIP_BASE64 }}
        run: |
          if [ -n "$DATA_ARCHIVE" ]; then
            echo "Unpacking test dataset from repository secret..."
            echo "$DATA_ARCHIVE" | base64 -d > data.zip
            unzip -q data.zip -d .
            echo "Data unpacked successfully:"
            ls -la data/
          else
            echo "Note: Full data/ directory not provided via DATA_ZIP_BASE64 secret."
            echo "Tests requiring production data will skip gracefully per brief guidelines."
          fi

      - name: Build Docker Container
        run: |
          docker compose build

      - name: Execute Pytest Suite in Docker
        run: |
          if [ -d "data" ]; then
            docker run --rm -v $(pwd)/data:/app/data:ro envira_test-loss-experience-api pytest -v
          else
            docker run --rm envira_test-loss-experience-api pytest -v
          fi

      - name: Verify Container Boot & Healthcheck
        run: |
          if [ -d "data" ]; then
            docker compose up -d
            echo "Waiting for service healthcheck on port 8000..."
            for attempt in {1..30}; do
              if curl -s -f http://localhost:8000/health > /dev/null; then
                echo "Service reported healthy on attempt ${attempt}."
                exit 0
              fi
              sleep 1
            done
            echo "Healthcheck timeout! Container logs:"
            docker compose logs
            exit 1
          fi

      - name: Teardown Docker Services
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
